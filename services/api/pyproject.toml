[project]
name = "nexora-api"
version = "0.1.0"
description = "Nexora personal AI assistant - core API (FastAPI + LangGraph)"
requires-python = ">=3.11,<3.15"
readme = "README.md"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "asyncpg>=0.32",
  "aiosqlite>=0.22",
  "pgvector>=0.4",
  "pyjwt[crypto]>=2.15",
  "cryptography>=50",
  "httpx>=0.28,<1",
  "email-validator>=2.2",
  "feedparser>=6.0.14",
  "langgraph>=1.2,<2",
  "livekit-api>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.5",
  "ruff>=0.17",
]
aws = ["boto3>=1.40"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
filterwarnings = ["ignore::DeprecationWarning:feedparser.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
# SIM105/SIM117: explicit try/except and nested `with` are kept for readability.
# ASYNC109: provider helpers take per-call HTTP timeouts by design.
ignore = ["S101", "B008", "S311", "UP040", "SIM105", "SIM117", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S105", "S106", "S108"]
"app/api/v1/auth.py" = ["S105"]  # token_type = "bearer" is not a secret
