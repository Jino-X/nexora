[project]
name = "nexora-voice-agent"
version = "0.1.0"
description = "Nexora real-time voice agent (LiveKit Agents)"
# livekit-agents does not support Python 3.15 yet
requires-python = ">=3.10,<3.15"
dependencies = [
  "livekit-agents[silero,turn-detector]~=1.8.12",
  "httpx>=0.28,<1",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "python-dotenv>=1.0",
  "numpy>=2",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "pytest-asyncio>=1.5", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["B008", "SIM105", "ASYNC109"]
