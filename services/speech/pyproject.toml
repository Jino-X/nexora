[project]
name = "nexora-speech"
version = "0.1.0"
description = "Nexora speech server: AI4Bharat IndicConformer STT and Indic Parler-TTS"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "numpy>=2",
]

[project.optional-dependencies]
# Model stack. IndicConformer needs onnxruntime + torchaudio and trust_remote_code. Parler-TTS pins its
# own transformers range: if the two conflict, run STT and TTS as two instances with
# SPEECH_ENABLE_TTS=false / SPEECH_ENABLE_STT=false in separate environments.
models = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "transformers>=4.46",
  "onnxruntime>=1.19",
  "parler-tts>=0.2.3",
  # parler-tts → descript-audiotools caps protobuf < 5, and sentencepiece 0.2.2+ needs protobuf >= 5.26
  # (ImportError: runtime_version when the Parler tokenizer loads).
  "sentencepiece>=0.2.1,<0.2.2",
  "faster-whisper>=1.1",
]
dev = ["pytest>=9.2", "httpx>=0.28", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["speech_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
